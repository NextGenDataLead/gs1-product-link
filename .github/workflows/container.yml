name: Container image

# Builds the operator shell image on every PR that could change it, and starts it for real:
# the suite has no Docker, so this is the only place the image is proved to run. On a release
# tag (v*) it publishes to ghcr.io/nextgendatalead/gs1-product-link, for amd64 and arm64
# (Apple silicon). The image holds code only — see Dockerfile and tests/test_container.py.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yml
      - docker/**
      - pyproject.toml
      - uv.lock
      - lib/**
      - scripts/**
      - ui/**
      - .github/workflows/container.yml
  push:
    tags: ["v*"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nextgendatalead/gs1-product-link

jobs:
  smoke:
    name: Build and start the image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t gs1-shell:smoke .

      - name: No data in the image
        run: |
          for path in /app/.env /app/clients.yml /app/input /app/output; do
            if docker run --rm --entrypoint sh gs1-shell:smoke -c "test -e $path"; then
              echo "::error::$path is in the image"; exit 1
            fi
          done

      # An empty data folder, owned by the image's user (uid 1000), as a new install has.
      - name: Start against an empty data folder
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name shell -p 127.0.0.1:8477:8477 -v "$RUNNER_TEMP/data:/data" gs1-shell:smoke

      - name: The shell answers, and the data folder was seeded
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8477/data; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8477/data | grep -q "GS1 Digital Link"
          sudo test -f "$RUNNER_TEMP/data/clients.yml"
          test "$(sudo stat -c %a "$RUNNER_TEMP/data/.env")" = "600"

      - name: Show the container log
        if: always()
        run: docker logs shell || true

  publish:
    name: Publish to GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
