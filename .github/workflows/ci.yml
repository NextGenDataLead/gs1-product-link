name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check

      - name: Ruff format check
        run: ruff format --check

      - name: Type-check (mypy --strict)
        run: mypy --strict lib

      - name: Tests
        run: pytest

      # The operator's machine installs from uv.lock, not from a fresh resolution, so a lock
      # that has drifted from pyproject.toml means that machine gets something nobody tested.
      # This job keeps installing with pip above — the check asserts the lockfile is current,
      # it does not change what CI resolves. uv is pinned to the version that wrote the lock;
      # bump it here, in install.command and in install.bat together.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.6/install.sh \
            | env UV_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lockfile matches pyproject
        run: uv lock --check

  gs1-nl-mcp:
    name: Build and test gs1-nl MCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm -w mcps/gs1-nl run build

      - name: Tests
        run: npm -w mcps/gs1-nl test

  wordpress-mcp:
    name: Build and test wordpress MCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm -w mcps/wordpress run build

      - name: Tests
        run: npm -w mcps/wordpress test

  qr-render-mcp:
    name: Build and test qr-render MCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm -w mcps/qr-render run build

      - name: Tests
        run: npm -w mcps/qr-render test
